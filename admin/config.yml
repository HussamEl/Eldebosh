          - { name: publisher, label: "الجهة", widget: string, hint: "Råd & Rön · Testfakta · Prisjakt · Kjell …" }
          - { name: url, label: "الرابط", widget: string }
          - { name: published, label: "تاريخ نشر المصدر", widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
          - { name: accessed, label: "تاريخ اطلاعنا", widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
          - { name: claim, label: "ماذا يقول المصدر (بصياغتك، لا نسخاً)", widget: text }
