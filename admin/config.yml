      - { name: solution, label: "صفحة الحل الأب (إلزامي)", widget: string, hint: "problem_id لصفحة الحل" }
      - { name: category, label: "الفئة", widget: relation, collection: categories, search_fields: [id], value_field: id, display_fields: [id] }
      - { name: subcategory, label: "الفئة الفرعية", widget: string, required: false }
      - name: picks
        label: "الترشيحات (منتجان على الأقل)"
        widget: list
        fields:
          - { name: product, label: "معرّف المنتج", widget: string }
          - { name: badge, label: "الوسم داخل هذا الدليل", widget: select, options: [best-overall, best-value, best-budget, best-specific, premium] }
          - { name: reason, label: "سبب الترشيح", widget: text }
      - { name: hands_on, label: "الصفحة تستند إلى تجربة فعلية", widget: boolean, default: false }
      - name: stage
