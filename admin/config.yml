          - { name: published, label: "تاريخ نشر المصدر", widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
          - { name: accessed, label: "تاريخ اطلاعنا", widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
          - { name: claim, label: "ماذا يقول المصدر (بصياغتك، لا نسخاً)", widget: text }
      - { name: body, label: "النص", widget: markdown }

  # ============ الصفحات الثابتة — سويدي ============
  - name: pages_sv
    label: "الصفحات الثابتة (سويدي)"
    label_singular: "صفحة"
    folder: src/content/pages/sv
    create: true
    extension: mdx
    format: frontmatter
    fields:
      - { name: lang, label: اللغة, widget: hidden, default: sv }
      - { name: title, label: "العنوان", widget: string }
      - { name: description, label: "الوصف", widget: text }
      - { name: slug, label: "المسار", widget: string }
      - { name: footer_group, label: "مكانها في الفوتر", widget: select, options: [legal, about, none], default: none }
      - { name: order, label: "الترتيب", widget: number, default: 99 }
      - name: stage
        label: "مرحلة النص"
        widget: select
        default: draft
        options:
          - { label: "هيكل — العنوان بلا نص", value: draft }
          - { label: "مكتوب — ينتظر مراجعة سويدية", value: written }
          - { label: "مُراجَع — جاهز ولم يُنشر", value: reviewed }
          - { label: "منشور — النص يظهر للزائر", value: published }
        hint: "«منشور» وحدها تُظهر النص. «هيكل» و«مكتوب» يريان الزائرَ صفحةً تقول إنها لم تُنشر بعد — ولا يمنع ذلك بقاء الرابط حياً"
      - { name: published, label: "منشور", widget: boolean, default: true }
      - { name: updated, label: "تاريخ التحديث", widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { name: body, label: "النص", widget: markdown }

  # ============ الفئات ============
  - name: categories
    label: "الفئات"
    label_singular: "فئة"
    folder: src/data/categories
    create: true
    extension: yaml
    format: yaml
    identifier_field: id
    fields:
      - { name: id, label: "المعرّف", widget: string, pattern: ['^[a-z0-9-]+$', 'حروف صغيرة وشرطات فقط'] }
      - { name: group, label: "المجموعة في القائمة", widget: select, options: [daily, mobility, home] }
      - { name: active, label: "مفعّلة (تظهر في القائمة)", widget: boolean, default: false, hint: "لا تفعّل الفئة قبل نشر 3 صفحات فيها" }
      - { name: order, label: "الترتيب", widget: number, default: 99 }
      - { name: icon, label: "الأيقونة", widget: string, default: circle }
      - name: names
        label: "الاسم"
        widget: object
        fields:
          - { name: sv, label: "سويدي", widget: string }
          - { name: en, label: "إنجليزي", widget: string }
      - name: slugs
        label: "المسار"
        widget: object
        fields:
          - { name: sv, label: "سويدي", widget: string }
          - { name: en, label: "إنجليزي", widget: string }
      - name: descriptions
        label: "الوصف"
        widget: object
        fields:
          - { name: sv, label: "سويدي", widget: text }
          - { name: en, label: "إنجليزي", widget: text }
      - name: subcategories
        label: "الفئات الفرعية"
        widget: list
        required: false
        fields:
          - { name: id, label: "المعرّف", widget: string }
          - name: names
            label: "الاسم"
            widget: object
            fields:
              - { name: sv, label: "سويدي", widget: string }
              - { name: en, label: "إنجليزي", widget: string }
          - name: slugs
            label: "المسار"
            widget: object
            fields:
              - { name: sv, label: "سويدي", widget: string }
              - { name: en, label: "إنجليزي", widget: string }
