<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة تحرير Eldebosh</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center; gap: .75rem;
        text-align: center; background: #123F66; color: #fff; z-index: 9999;
      }
      #boot b { font-size: 1.35rem; letter-spacing: -.02em; }
      #boot span { color: #BBD9F2; font-size: .9rem; max-width: 32ch; }
      #boot i { display:block; width: 120px; height: 3px; background:#2F6A9B; border-radius:2px; margin: .5rem auto 0; overflow:hidden; }
      #boot i::after { content:""; display:block; width:40%; height:100%; background:#55C6F2; animation: fill 1.1s ease-in-out infinite alternate; }
      @keyframes fill { from { width: 15% } to { width: 85% } }
    </style>
  </head>
  <body>
    <div id="boot">
      <b>لوحة تحرير Eldebosh</b>
      <span>اضغط «Sign In with Token» ثم الصق رمز الوصول من GitHub.</span>
      <i></i>
    </div>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <script type="module">
      const boot = document.getElementById('boot');
      const hide = () => boot && boot.remove();
      window.addEventListener('load', () => setTimeout(hide, 900));
      setTimeout(hide, 4000);
    </script>
  </body>
</html>
