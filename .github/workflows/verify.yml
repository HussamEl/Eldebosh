name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    name: bygg och verifiera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # bygger från källan till site/ — validate.mjs stoppar bygget vid regelbrott
      - run: npm run build

      - run: npm run check:css
      - run: npm run test:ui
      - run: npm run test:browser
      - run: npm run audit

      # site/ får inte glida ifrån källan. Byggstämpeln och Pagefinds
      # nyckelordning ändras varje körning med flit och normaliseras bort.
      - run: npm run check:drift
