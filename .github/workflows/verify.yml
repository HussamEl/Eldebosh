# Build, verify, then publish — one workflow, one build.
#
# The site is built here from source; site/ is not committed. That is what
# lets an edit made in the admin panel (/admin/, which commits source files
# only) reach the live site with no manual step.
#
#   verify   builds site/, runs every check, and hands the exact build on.
#   publish  runs only if verify passed, and only on main. It publishes the
#            build it was handed — it never builds again — to the `deploy`
#            branch, which the host pulls from.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the site-version stamp is the time of the last commit
          # that touched the site's sources (src/lib/build-stamp.ts).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # validate.mjs runs first inside build and stops it on any rule violation.
      - run: npm run build

      - run: npm run test:claims
      - run: npm run check:css
      - run: npm run check:colors
      - run: npm run check:docs
      - run: npm run check:admin
      - run: npm run check:links
      - run: npm run test:ui
      - run: npm run test:browser
      - run: npm run test:admin
      - run: npm run audit
      - run: npm run check:drafts

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
          # site/.htaccess sets the index page, 404 page and caching rules.
          # Hidden files are dropped by default; losing it would break the site.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to the deploy branch
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the deploy branch history keeps each publish a fast-forward

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - name: Publish site/ to the deploy branch
        run: |
          test -f site/.htaccess || { echo "site/.htaccess missing — refusing to publish"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-deploy-branch.mjs
