name: Build and deploy to Hostinger

# TILLFÄLLIGT: bara manuell körning. FTP-deployen faller på
# "Timeout (control socket)" — Hostinger tycks blockera GitHub-runners.
# Diagnostik och nästa steg: docs/project/DEPLOY_FIX.md
# Slå på push-triggern igen så fort en deploy faktiskt går igenom.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # يفشل هنا إذا خُرقت أي قاعدة ملزمة — لا يُنشر محتوى مخالف.
      - run: npm run build

      # يُحفظ الناتج دائماً — يمكن تنزيله ورفعه يدوياً إذا تعطّل FTP.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # المحاولة الأولى: FTPS المشفّر (الافتراضي على Hostinger)
      - name: Deploy over FTPS
        id: ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          timeout: 120000
          log-level: standard
          security: loose
          # يحذف ما لم يعد يُولَّد — يمنع بقاء صفحات قديمة على الخادم
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**

      # المحاولة الثانية: FTP عادي — بعض حسابات Hostinger لا تقبل TLS
      - name: Retry over plain FTP
        if: steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: ./dist/
          protocol: ftp
          port: 21
          timeout: 120000
          log-level: verbose
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
